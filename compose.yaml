name: orderflow

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    container_name: orderflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DEFAULT_DB}
      ORDERS_DB_NAME: ${ORDERS_DB_NAME}
      ORDERS_DB_USER: ${ORDERS_DB_USER}
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD}
      INVENTORY_DB_NAME: ${INVENTORY_DB_NAME}
      INVENTORY_DB_USER: ${INVENTORY_DB_USER}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
      PAYMENTS_DB_NAME: ${PAYMENTS_DB_NAME}
      PAYMENTS_DB_USER: ${PAYMENTS_DB_USER}
      PAYMENTS_DB_PASSWORD: ${PAYMENTS_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_ADMIN_USER} -d ${POSTGRES_DEFAULT_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  pulsar:
    image: ${PULSAR_IMAGE}
    container_name: orderflow-pulsar
    restart: unless-stopped
    command: ["bin/pulsar", "standalone"]
    environment:
      PULSAR_STANDALONE_USE_ZOOKEEPER: "1"
      PULSAR_MEM: >-
        -Xms512m
        -Xmx512m
        -XX:MaxDirectMemorySize=256m
    ports:
      - "6650:6650"
      - "8080:8080"
    volumes:
      - pulsar-data:/pulsar/data
      - pulsar-conf:/pulsar/conf
    healthcheck:
      test: ["CMD", "bin/pulsar-admin", "brokers", "healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  pulsar-init:
    image: ${PULSAR_IMAGE}
    container_name: orderflow-pulsar-init
    depends_on:
      pulsar:
        condition: service_healthy
    command:
      - /bin/bash
      - -c
      - >
        bin/pulsar-admin
        --admin-url http://pulsar:8080
        topics create-partitioned-topic
        ${PULSAR_TOPIC}
        --partitions 4
        ||
        bin/pulsar-admin
        --admin-url http://pulsar:8080
        topics get-partitioned-topic-metadata
        ${PULSAR_TOPIC}
    restart: "no"

  orders-api:
    build:
      context: .
      dockerfile: src/Orders/OrderFlow.Orders.Api/Dockerfile
    container_name: orderflow-orders-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Database__ConnectionString: >-
        Host=postgres;Port=5432;Database=${ORDERS_DB_NAME};Username=${ORDERS_DB_USER};Password=${ORDERS_DB_PASSWORD}
      Pulsar__AdminUrl: ${PULSAR_ADMIN_URL}
      Pulsar__ServiceUrl: ${PULSAR_SERVICE_URL}
      Pulsar__Topic: ${PULSAR_TOPIC}
      Pulsar__LookupPath: ${PULSAR_LOOKUP_PATH}
    ports:
      - "${ORDERS_HTTP_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      pulsar-init:
        condition: service_completed_successfully

  inventory-api:
    build:
      context: .
      dockerfile: src/Inventory/OrderFlow.Inventory.Api/Dockerfile
    container_name: orderflow-inventory-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Database__ConnectionString: >-
        Host=postgres;Port=5432;Database=${INVENTORY_DB_NAME};Username=${INVENTORY_DB_USER};Password=${INVENTORY_DB_PASSWORD}
      Pulsar__AdminUrl: ${PULSAR_ADMIN_URL}
      Pulsar__ServiceUrl: ${PULSAR_SERVICE_URL}
      Pulsar__Topic: ${PULSAR_TOPIC}
      Pulsar__LookupPath: ${PULSAR_LOOKUP_PATH}
    ports:
      - "${INVENTORY_HTTP_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      pulsar-init:
        condition: service_completed_successfully

  payments-api:
    build:
      context: .
      dockerfile: src/Payments/OrderFlow.Payments.Api/Dockerfile
    container_name: orderflow-payments-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Database__ConnectionString: >-
        Host=postgres;Port=5432;Database=${PAYMENTS_DB_NAME};Username=${PAYMENTS_DB_USER};Password=${PAYMENTS_DB_PASSWORD}
      Pulsar__AdminUrl: ${PULSAR_ADMIN_URL}
      Pulsar__ServiceUrl: ${PULSAR_SERVICE_URL}
      Pulsar__Topic: ${PULSAR_TOPIC}
      Pulsar__LookupPath: ${PULSAR_LOOKUP_PATH}
    ports:
      - "${PAYMENTS_HTTP_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      pulsar-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  pulsar-data:
  pulsar-conf:
