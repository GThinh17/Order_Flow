name: orderflow

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    container_name: orderflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DEFAULT_DB}
      ORDERS_DB_NAME: ${ORDERS_DB_NAME}
      ORDERS_DB_USER: ${ORDERS_DB_USER}
      ORDERS_DB_PASSWORD: orders_dev_password
      INVENTORY_DB_NAME: ${INVENTORY_DB_NAME}
      INVENTORY_DB_USER: ${INVENTORY_DB_USER}
      INVENTORY_DB_PASSWORD: inventory_dev_password
      PAYMENTS_DB_NAME: ${PAYMENTS_DB_NAME}
      PAYMENTS_DB_USER: ${PAYMENTS_DB_USER}
      PAYMENTS_DB_PASSWORD: payments_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_ADMIN_USER} -d ${POSTGRES_DEFAULT_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  pulsar:
    image: ${PULSAR_IMAGE}
    container_name: orderflow-pulsar
    restart: unless-stopped
    command:
      ["bin/pulsar", "standalone", "--advertised-address", "pulsar"]
    environment:
      PULSAR_STANDALONE_USE_ZOOKEEPER: "1"
      PULSAR_MEM: >-
        -Xms512m
        -Xmx512m
        -XX:MaxDirectMemorySize=256m
    ports:
      - "6650:6650"
      - "8080:8080"
    volumes:
      - pulsar-data:/pulsar/data
      - pulsar-conf:/pulsar/conf
    healthcheck:
      test: ["CMD", "bin/pulsar-admin", "brokers", "healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  pulsar-init:
    image: ${PULSAR_IMAGE}
    container_name: orderflow-pulsar-init

    depends_on:
      pulsar:
        condition: service_healthy

    environment:
      PULSAR_ADMIN_URL: http://pulsar:8080
      PULSAR_TOPIC: ${PULSAR_TOPIC}
      PULSAR_PARTITIONS: "4"

    volumes:
      - ./docker/pulsar/init-topics.sh:/pulsar/init-topics.sh:ro

    command:
      - /bin/bash
      - /pulsar/init-topics.sh

    restart: "no"

  orders-api:
    build:
      context: .
      dockerfile: src/Orders/OrderFlow.Orders.Api/Dockerfile
    container_name: orderflow-orders-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "${ORDERS_HTTP_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      pulsar-init:
        condition: service_completed_successfully

  inventory-api:
    build:
      context: .
      dockerfile: src/Inventory/OrderFlow.Inventory.Api/Dockerfile
    container_name: orderflow-inventory-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "${INVENTORY_HTTP_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      pulsar-init:
        condition: service_completed_successfully

  payments-api:
    build:
      context: .
      dockerfile: src/Payments/OrderFlow.Payments.Api/Dockerfile
    container_name: orderflow-payments-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "${PAYMENTS_HTTP_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      pulsar-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  pulsar-data:
  pulsar-conf:
